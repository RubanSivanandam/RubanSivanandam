<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" fill="none"><style>text{font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif}.s{font-family:'Bodoni Moda','Bodoni 72','Didot','Bodoni MT','Playfair Display',Georgia,serif}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}.rise{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(16px)}}.fade{animation:fade 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0}}.draw{animation:draw 1.6s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:0 50%}@keyframes draw{from{transform:scaleX(0)}}.breathe{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes breathe{50%{transform:rotate(45deg) scale(1.35);opacity:.65}}</style><defs></defs><line class="draw" x1="300" y1="30" x2="700" y2="30" stroke="#2C2C2C" style="animation-delay:0.00s"/><rect class="breathe" x="495.5" y="25.5" width="9" height="9" fill="#C9A24B" transform="rotate(45 500.0 30.0)" style="animation-delay:0.00s"/><text x="500.0" y="88" text-anchor="middle" class="s rise" font-size="30" fill="#F5F3EE" style="animation-delay:.2s">Thank you for visiting.</text><text x="500.0" y="122" text-anchor="middle" class="m fade" font-size="10.5" letter-spacing="2.6" fill="#55524E" style="animation-delay:.5s">RE-RENDERED 19 Oct 2026 · 08:33 UTC · GITHUB.COM/RUBANSIVANANDAM</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28" fill="none"><style>text{font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif}.s{font-family:'Bodoni Moda','Bodoni 72','Didot','Bodoni MT','Playfair Display',Georgia,serif}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}.rise{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(16px)}}.fade{animation:fade 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0}}.draw{animation:draw 1.6s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:0 50%}@keyframes draw{from{transform:scaleX(0)}}.breathe{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes breathe{50%{transform:rotate(45deg) scale(1.35);opacity:.65}}</style><defs></defs><defs><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#2C2C2C" stop-opacity="0"/><stop offset=".5" stop-color="#2C2C2C"/><stop offset="1" stop-color="#2C2C2C" stop-opacity="0"/></linearGradient></defs><line x1="0" y1="14" x2="1000" y2="14" stroke="url(#fade)"/><rect x="496.0" y="10" width="8" height="8" fill="#C9A24B" transform="rotate(45 500.0 14)"/><rect y="13.5" width="60" height="1" fill="#C9A24B" opacity=".7"><animate attributeName="x" values="-60;1000;-60" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;.7;0;0" keyTimes="0;.1;.4;.5;1" dur="14s" repeatCount="indefinite"/></rect></svg>
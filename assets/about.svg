<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none"><style>text{font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif}.s{font-family:'Bodoni Moda','Bodoni 72','Didot','Bodoni MT','Playfair Display',Georgia,serif}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}.rise{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(16px)}}.fade{animation:fade 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0}}.draw{animation:draw 1.6s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:0 50%}@keyframes draw{from{transform:scaleX(0)}}.breathe{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes breathe{50%{transform:rotate(45deg) scale(1.35);opacity:.65}}</style><defs></defs><rect x=".5" y=".5" width="999" height="299" rx="6" fill="#0A0A0A" stroke="#1E1E1E"/><rect x="14.5" y="14.5" width="971" height="271" rx="2" stroke="#2C2C2C" stroke-opacity=".55"/><text x="56" y="62" text-anchor="start" class="m fade" font-size="11" letter-spacing="3.4" fill="#C9A24B" style="animation-delay:0.00s">ABOUT</text><line class="draw" x1="120" y1="58" x2="300" y2="58" stroke="#2C2C2C" style="animation-delay:0.30s"/><text x="56" y="126" class="s rise" font-size="36" fill="#F5F3EE" style="animation-delay:0.25s">Build agents whose work</text><text x="56" y="176" class="s rise" font-size="36" fill="#F5F3EE" style="animation-delay:0.39s">you can check, behind</text><text x="56" y="226" class="s rise" font-size="36" fill="#F5F3EE" style="animation-delay:0.53s">guardrails they can’t talk past.</text><line x1="640" y1="48" x2="640" y2="252" stroke="#2C2C2C" class="fade" style="animation-delay:.4s"/><text x="672" y="70" text-anchor="start" class="m fade" font-size="11" letter-spacing="3.4" fill="#8C8A85" style="animation-delay:0.50s">ROLE</text><text x="672" y="92" class="rise" font-size="14.5" fill="#F5F3EE" style="animation-delay:0.60s">AI Engineer</text><text x="672" y="112" class="rise" font-size="14.5" fill="#C9C5BC" style="animation-delay:0.60s">agentic systems · Claude Code · MCP</text><text x="672" y="144" text-anchor="start" class="m fade" font-size="11" letter-spacing="3.4" fill="#8C8A85" style="animation-delay:0.65s">FOCUS</text><text x="672" y="166" class="rise" font-size="14.5" fill="#F5F3EE" style="animation-delay:0.75s">multi-agent orchestration, RAG,</text><text x="672" y="186" class="rise" font-size="14.5" fill="#C9C5BC" style="animation-delay:0.75s">LLM evaluation, AI security</text><text x="672" y="218" text-anchor="start" class="m fade" font-size="11" letter-spacing="3.4" fill="#8C8A85" style="animation-delay:0.80s">LEARNING</text><text x="672" y="240" class="rise" font-size="14.5" fill="#F5F3EE" style="animation-delay:0.90s">in public: one agentic-AI</text><text x="672" y="260" class="rise" font-size="14.5" fill="#C9C5BC" style="animation-delay:0.90s">concept a day on LinkedIn</text></svg>
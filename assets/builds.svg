" width="5" height="5" fill="#6B5A33" transform="rotate(45 454.5 358.5)"/><text x="470" y="364" font-size="12.8" fill="#C9C5BC">Learning-tracker MCP server on a zero-dependency engine</text></g><line class="draw" x1="56" y1="400" x2="944" y2="400" stroke="#2C2C2C" style="animation-delay:0.72s"/><g class="rise" style="animation-delay:0.64s"><text x="56" y="442" class="m" font-size="12" letter-spacing="2" fill="#C9A24B">03</text><text x="96" y="448" class="s" font-size="30" fill="#F5F3EE">Creators Agentic AI</text><text x="96" y="474" class="m" font-size="10.5" letter-spacing="2.4" fill="#8C8A85">SHOWRUNNER · REVENUE, NOT VIEWS</text><text x="96" y="526" class="m" font-size="10.5" letter-spacing="2.4" fill="#55524E">PYTHON  /  NEXT.JS  /  CELERY  /  DOCKER</text><rect x="452" y="430" width="5" height="5" fill="#6B5A33" transform="rotate(45 454.5 432.5)"/><text x="470" y="438" font-size="12.8" fill="#C9C5BC">An AI organisation for creators: agents with roles, memory and KPIs</text><rect x="452" y="458" width="5" height="5" fill="#6B5A33" transform="rotate(45 454.5 460.5)"/><text x="470" y="466" font-size="12.8" fill="#C9C5BC">Daily run: trends → competitors → revenue → a decision you approve</text><rect x="452" y="486" width="5" height="5" fill="#6B5A33" transform="rotate(45 454.5 488.5)"/><text x="470" y="494" font-size="12.8" fill="#C9C5BC">Ideas ranked by expected return, priced on the creator&#x27;s real RPM</text><rect x="452" y="514" width="5" height="5" fill="#6B5A33" transform="rotate(45 454.5 516.5)"/><text x="470" y="522" font-size="12.8" fill="#C9C5BC">Self-hosted, runs with zero API keys; approval gates on by default</text></g><line class="draw" x1="56" y1="558" x2="944" y2="558" stroke="#2C2C2C" style="animation-delay:0.94s"/></svg>
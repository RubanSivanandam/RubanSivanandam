<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="596" viewBox="0 0 1000 596" fill="none"><style>text{font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif}.s{font-family:'Bodoni Moda','Bodoni 72','Didot','Bodoni MT','Playfair Display',Georgia,serif}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}.rise{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(16px)}}.fade{animation:fade 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0}}.draw{animation:draw 1.6s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:0 50%}@keyframes draw{from{transform:scaleX(0)}}.breathe{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes breathe{50%{transform:rotate(45deg) scale(1.35);opacity:.65}}</style><defs></defs><rect x=".5" y=".5" width="999" height="595" rx="6" fill="#0A0A0A" stroke="#1E1E1E"/><rect x="14.5" y="14.5" width="971" height="567" rx="2" stroke="#2C2C2C" stroke-opacity=".55"/><text x="56" y="62" text-anchor="start" class="m fade" font-size="11" letter-spacing="3.4" fill="#C9A24B" style="animation-delay:0.00s">SELECTED BUILDS</text><text x="944" y="62" text-anchor="end" class="m fade" font-size="11" letter-spacing="3.4" fill="#8C8A85" style="animation-delay:0.00s">PRIVATE REPOSITORIES</text><g class="rise" style="animation-delay:0.20s"><text x="56" y="126" class="m" font-size="12" letter-spacing="2" fill="#C9A24B">01</text><text x="96" y="132" class="s" font-size="30" fill="#F5F3EE">Claude Code Harness</text><text x="96" y="158" class="m" font-size="10.5" letter-spacing="2.4" fill="#8C8A85">PORTABLE · GUARDED · SELF-TESTING</text><text x="96" y="210" class="m" font-size="10.5" letter-spacing="2.4" fill="#55524E">PYTHON  /  HOOKS  /  MCP  /  CI</text><rect x="452" y="114" width="5" height="5" fill="#6B5A33" transform="rotate(45 454.5 116.5)"/><text x="470" y="122" font-size="12.8" fill="#C9C5BC"
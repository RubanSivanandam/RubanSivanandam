<svg xmlns="http://www.w3.org/2000/svg" width="490" height="268" viewBox="0 0 490 268" fill="none"><style>text{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}.run{stroke-dasharray:160 1348;animation:run 7s linear infinite}@keyframes run{to{stroke-dashoffset:-1508}}</style><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1E293B"/></pattern></defs><rect x="1" y="1" width="488" height="266" rx="18" fill="#0D1320" stroke="#1E293B"/><rect x="1" y="1" width="488" height="266" rx="18" fill="url(#dots)" opacity=".5"/><rect class="run" x="1" y="1" width="488" height="266" rx="18" stroke="#F472B6" stroke-width="2" filter="url(#glow)"/><polygon points="44,30 58,38 58,54 44,62 30,54 30,38" fill="#F472B6" fill-opacity=".15" stroke="#F472B6"/><circle cx="44" cy="46" r="4" fill="#F472B6"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle><text x="74" y="46" font-size="22" font-weight="800" fill="#E6EDF3">NodeJS_CRUD_Backend</text><text x="74" y="66" class="m" font-size="11.5" fill="#F472B6">Employee records REST API</text><text x="30" y="104" font-size="13.5" fill="#E6EDF3"><tspan fill="#F472B6">▸ </tspan>Create / read / update / delete for employee records</text><text x="30" y="131" font-size="13.5" fill="#E6EDF3"><tspan fill="#F472B6">▸ </tspan>Mongoose models over MongoDB, PostgreSQL client wired in</text><text x="30" y="158" font-size="13.5" fill="#E6EDF3"><tspan fill="#F472B6">▸ </tspan>JWT-protected routes through auth middleware</text><text x="30" y="185" font-size="13.5" fill="#E6EDF3"><tspan fill="#F472B6">▸ </tspan>Hardened with helmet, CORS and no-cache headers</text><rect x="30" y="218" width="70" height="24" rx="12" fill="#F472B6" fill-opacity=".1" stroke="#F472B6" stroke-opacity=".45"/><text x="40" y="234.5" class="m" font-size="11.5" fill="#F472B6">Node.js</text><rect x="108.4" y="218" width="70" height="24" rx="12" fill="#F472B6" fill-opacity=".1" stroke="#F472B6" stroke-opacity=".45"/><text x="118.4" y="234.5" class="m" font-size="11.5" fill="#F472B6">Express</text><rect x="186.8" y="218" width="70" height="24" rx="12" fill="#F472B6" fill-opacity=".1" stroke="#F472B6" stroke-opacity=".45"/><text x="196.8" y="234.5" class="m" font-size="11.5" fill="#F472B6">MongoDB</text><rect x="265.20000000000005" y="218" width="92" height="24" rx="12" fill="#F472B6" fill-opacity=".1" stroke="#F472B6" stroke-opacity=".45"/><text x="275.20000000000005" y="234.5" class="m" font-size="11.5" fill="#F472B6">PostgreSQL</text></svg>
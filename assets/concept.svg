<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" fill="none"><style>text{font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif}.s{font-family:'Bodoni Moda','Bodoni 72','Didot','Bodoni MT','Playfair Display',Georgia,serif}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}.rise{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(16px)}}.fade{animation:fade 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0}}.draw{animation:draw 1.6s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:0 50%}@keyframes draw{from{transform:scaleX(0)}}.breathe{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes breathe{50%{transform:rotate(45deg) scale(1.35);opacity:.65}}</style><defs></defs><rect x=".5" y=".5" width="999" height="189" rx="6" fill="#0A0A0A" stroke="#1E1E1E"/><rect x="14.5" y="14.5" width="971" height="161" rx="2" stroke="#2C2C2C" stroke-opacity=".55"/><text x="56" y="62" text-anchor="start" class="m fade" font-size="11" letter-spacing="3.4" fill="#C9A24B" style="animation-delay:0.00s">PATTERN OF THE DAY · 24 OCT 2026</text><text x="56" y="114" class="s rise" font-size="36" fill="#F5F3EE" style="animation-delay:.2s">Voyager</text><line class="draw" x1="56" y1="132" x2="300" y2="132" stroke="#C9A24B" style="animation-delay:0.60s"/><text x="56" y="160" class="rise" font-size="14.5" fill="#C9C5BC" style="animation-delay:.4s">A lifelong-learning agent that grows a reusable library of executable skills as it explores.</text><text x="944" y="62" text-anchor="end" class="m fade" font-size="11" letter-spacing="2" fill="#8C8A85">ARXIV:2305.16291</text></svg>